[workspace]
members = ["crates/verity_core", "crates/verity_cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
oxigraph = { version = "=0.5.11", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
schemars = "=1.0.4"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
