name: Issue 6 one-shot Rust formatter
on:
  push:
    branches: [feat/issue-6-scoped-constant-validation]
    paths: [.github/workflows/issue6-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'grove/graph-verity' && github.ref == 'refs/heads/feat/issue-6-scoped-constant-validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/issue-6-scoped-constant-validation
      - name: Install toolchain
        run: rustup install
      - name: Format and remove temporary workflow
        run: |
          cargo fmt --all
          git rm .github/workflows/issue6-format-once.yml
          git add crates/verity_core/src/compiler.rs crates/verity_core/src/execution.rs crates/verity_core/tests/core.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(core): apply pinned rustfmt and remove temporary formatter"
          git push origin HEAD:feat/issue-6-scoped-constant-validation
