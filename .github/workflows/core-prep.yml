name: One-time core preparation
on:
  push:
    branches: [feat/pre-llm-core]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'grove/graph-verity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-llm-core
      - run: rustup install
      - name: Apply explicit initial source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/verity_cli/src/main.rs')
          p.write_text(p.read_text().replace('let scope = serde_json::from_value', 'let scope: Vec<String> = serde_json::from_value'))
          p = Path('crates/verity_core/src/compiler.rs')
          s = p.read_text()
          s = s.replace('        for having in &plan.having {', '        let mut having_conditions = Vec::new();\n        for having in &plan.having {')
          s = s.replace('            tail.push_str(&format!("HAVING ({count} {} {})\\n", having.op.sparql(), having.value));', '            having_conditions.push(format!("({count} {} {})", having.op.sparql(), having.value));')
          s = s.replace('        let order = outputs.iter()', '        if !having_conditions.is_empty() {\n            tail.push_str(&format!("HAVING {}\\n", having_conditions.join(" ")));\n        }\n        let order = outputs.iter()')
          p.write_text(s)
          PY
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - name: Commit generated files to the core feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format core, refresh lock and correct scoped CLI and HAVING assembly'
            git push origin HEAD:feat/pre-llm-core
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
