name: One-time foundation preparation
on:
  push:
    branches: [feat/pre-llm-foundation]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'grove/graph-verity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-llm-foundation
      - run: rustup install
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - name: Commit generated files to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git commit -m 'chore: pin resolved dependencies and apply rustfmt'
            git push origin HEAD:feat/pre-llm-foundation
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p verity_cli -- smoke tests/fixtures/smoke.trig trig
