name: Rust CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Replay hashes binaries repeatedly; omit debug symbols, retaining debug assertions.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: symbols
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Offline tests export the exact frozen #57 and #64 source commits.
      - name: Install pinned Rust toolchain
        run: rustup install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned reference-query dependencies
        run: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements.txt
      - name: Build Rust binaries and examples before the bounded Python suite
        run: cargo build --locked --bins --examples
      - name: Test the isolated SHACL guidance crate
        env:
          CARGO_TARGET_DIR: target
        run: cargo test --manifest-path crates/verity_shacl/Cargo.toml --locked
      - name: Check Chrome cold startup before the bounded browser walkthroughs
        run: |
          mkdir -p artifacts/pre-llm
          browser_profile=$(mktemp -d)
          trap 'rm -rf "$browser_profile"' EXIT
          google-chrome --version
          timeout 45s google-chrome --headless=new --no-first-run --no-default-browser-check \
            --disable-background-networking --disable-component-update --disable-sync \
            --metrics-recording-only --user-data-dir="$browser_profile" --dump-dom about:blank \
            > artifacts/pre-llm/browser-startup.stdout.txt 2> artifacts/pre-llm/browser-startup.stderr.txt
          grep -Fq '<html><head></head><body></body></html>' artifacts/pre-llm/browser-startup.stdout.txt
      - name: Verify the complete pre-LLM pipeline without refreshing data or gold
        env:
          REQUIRE_FIND_BROWSER: '1'
        run: .venv/bin/python tools/verify_pre_llm.py
      - name: Preserve verification results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-llm-verification-${{ github.sha }}
          path: |
            artifacts/pre-llm/
            data/worldcities-transfer/source.csv
            data/worldcities-transfer/snapshot.nq
            data/worldcities-transfer/manifest.json
          if-no-files-found: warn
          retention-days: 30
